# CI for remote-pc-mcp (public). Standalone Python MCP server. Runs the suite on
# every push, gates ruff pyflakes (F), and reports pip-audit. CodeQL lives in a
# separate workflow (codeql.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    # The suite boots the real server, which imports pyautogui — that needs a
    # display and cannot import on a headless Linux runner, so the tests run on
    # Windows (the platform this server targets). shell: bash because Windows
    # runners default to PowerShell.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - if: always()
        run: |
          echo '### Python tests (pytest)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAILED|ERROR|passed|failed" pytest.log | sed 's/\x1b\[[0-9;]*m//g' | tail -n 30 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install ruff
      # F rules only (pyflakes: unused imports, undefined names, f-string bugs).
      - run: ruff check --select F .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt pip-audit
      - name: pip-audit
        continue-on-error: true
        run: pip-audit --desc 2>&1 | tee audit.log; exit ${PIPESTATUS[0]}
      - if: always()
        run: |
          echo '### pip-audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 audit.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
